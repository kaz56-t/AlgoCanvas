[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    # Database
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    # Validation
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    # Data processing
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    # Backtesting
    "backtrader==1.9.78.123",
    # Market data
    "yfinance>=0.2.38",
    # File upload
    "python-multipart>=0.0.9",
    # LLM / HTTP client
    "httpx>=0.27.0",
    "openai>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
